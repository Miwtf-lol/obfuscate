<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Deobfuscator — Giải mã script online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;overflow:hidden}
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);border-bottom:1px solid #2a3a5c;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,#ff6b6b,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:13px;color:#8899aa;margin-left:auto}
.header .actions{display:flex;gap:8px;align-items:center}
.btn{padding:6px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#ff6b6b,#ff8e53);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(255,107,107,.3)}
.btn-secondary{background:#1e2d42;color:#b0c4de;border:1px solid #2a3a5c}
.btn-secondary:hover{background:#2a3d5a}
.btn-success{background:#ffd93d;color:#0a0e17}
.btn-success:hover{box-shadow:0 4px 20px rgba(255,217,61,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.container{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 64px)}
.panel{display:flex;flex-direction:column;min-height:0}
.panel-left{border-right:1px solid #1e2d42}
.panel-header{padding:8px 16px;border-bottom:1px solid #1e2d42;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:10px;background:#0d1117;flex-shrink:0}
.panel-header .badge{padding:2px 8px;border-radius:10px;font-size:10px;background:#1e2d42;color:#8899aa}
.panel-header .badge.active{background:#ffd93d22;color:#ffd93d;border:1px solid #ffd93d44}
.panel-header .badge.warn{background:#ff6b6b22;color:#ff6b6b;border:1px solid #ff6b6b44}
.editor-wrap{flex:1;position:relative;overflow:hidden}
.editor-wrap textarea{width:100%;height:100%;resize:none;border:none;outline:none;background:#0a0e17;color:#e0e0e0;font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;padding:16px;tab-size:4;overflow:auto}
.editor-wrap textarea::placeholder{color:#3a4a5a}
.status-bar{display:flex;align-items:center;gap:12px;padding:5px 16px;border-top:1px solid #1e2d42;font-size:11px;color:#5a6a7a;background:#0d1117;flex-shrink:0}
.status-bar .stat{display:flex;align-items:center;gap:4px}
.status-bar .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-bar .dot.green{background:#00e676}
.status-bar .dot.yellow{background:#ffd93d}
.status-bar .dot.red{background:#ff6b6b}
.options-bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px;border-bottom:1px solid #1e2d42;background:#0d1117;flex-shrink:0}
.opt-check{display:flex;align-items:center;gap:5px;font-size:12px;color:#8899aa;cursor:pointer;padding:2px 8px;border-radius:4px;transition:all .2s}
.opt-check:hover{background:#1a2538;color:#b0c4de}
.opt-check input{accent-color:#ff6b6b;width:14px;height:14px;cursor:pointer}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:999;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1);pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#00e676;color:#0a0e17;box-shadow:0 8px 32px rgba(0,230,118,.3)}
.toast.error{background:#ff6b6b;color:#fff;box-shadow:0 8px 32px rgba(255,107,107,.3)}
.toast.info{background:#4fc3f7;color:#0a0e17;box-shadow:0 8px 32px rgba(79,195,247,.3)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0e17}
::-webkit-scrollbar-thumb{background:#1e2d42;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#2a3a5c}
@media(max-width:768px){
  .container{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 64px)}
  .panel-left{border-right:none;border-bottom:1px solid #1e2d42}
  .panel{min-height:50vh}
  .header .sub{display:none}
}
.detection-badges{display:flex;flex-wrap:wrap;gap:4px;padding:6px 16px;border-bottom:1px solid #1e2d42;background:#0d1117;flex-shrink:0}
.det-badge{padding:2px 10px;border-radius:10px;font-size:10px;font-weight:500;border:1px solid transparent}
.det-badge.hex{background:#4fc3f722;color:#4fc3f7;border-color:#4fc3f744}
.det-badge.b64{background:#00e67622;color:#00e676;border-color:#00e67644}
.det-badge.unicode{background:#ffd93d22;color:#ffd93d;border-color:#ffd93d44}
.det-badge.eval{background:#ff6b6b22;color:#ff6b6b;border-color:#ff6b6b44}
.det-badge.packed{background:#ab47bc22;color:#ce93d8;border-color:#ab47bc44}
.det-badge.other{background:#5a6a7a22;color:#8899aa;border-color:#5a6a7a44}
</style>

<body>

<div class="header">
  <h1>&#x25C6; Web Deobfuscator</h1>

<script>
// ============================================================
// WEB DEOBFUSCATOR ENGINE v1.0
// ============================================================

let toastTimer;
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>t.classList.add('show'));
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

function handleFileUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('inputCode').value=ev.target.result;
    updateInputStats();
    detectObfuscation();
    showToast('Đã load: '+file.name,'info');
  };
  reader.readAsText(file);
  e.target.value='';
}

function updateInputStats(){
  const v=document.getElementById('inputCode').value;
  document.getElementById('inputChars').textContent=v.length+' ký tự';
  document.getElementById('inputLines').textContent=(v.split('\n').length)+' dòng';
}
document.getElementById('inputCode').addEventListener('input',()=>{updateInputStats();detectObfuscation();});
updateInputStats();

// ============================================================
// PHÁT HIỆN KỸ THUẬT OBFUSCATION
// ============================================================

function detectObfuscation(){
  const code=document.getElementById('inputCode').value;
  const area=document.getElementById('detectionArea');
  let badges=[];
  
  // Làm sạch area cũ
  area.innerHTML='<span style="font-size:10px;color:#5a6a7a;margin-right:4px">Phát hiện:</span>';
  
  if(!code.trim()){area.innerHTML+='<span class="det-badge other">Chưa có code</span>';return}
  
  // Kiểm tra packed JS (eval(function...))
  if(/eval\s*\(/.test(code)&&/function\s*\(p,a,c,k,e,d\)/.test(code)){
    badges.push({type:'eval',label:'Packed JS (eval)'});
  }
  // Kiểm tra eval thuần
  if(/eval\s*\(/.test(code)&&!/function\s*\(p,a,c,k,e,d\)/.test(code)){
    badges.push({type:'eval',label:'eval()'});
  }
  // Base64
  const b64matches=code.match(/[A-Za-z0-9+/]{40,}={0,2}/g);
  if(b64Matches&&b64Matches.length>0){
    // Thử decode xem có ra text không
    let b64Count=0;
    for(let m of b64Matches){
      try{
        const decoded=atob(m);
        if(decoded.length>10&&/[a-zA-Z]{5,}/.test(decoded))b64Count++;
      }catch(e){}
    }
    if(b64Count>0)badges.push({type:'b64',label:'Base64'});
  }
  // Hex escapes trong string
  if(/\\x[0-9a-f]{2}/i.test(code)){
    // Đếm số lượng hex escape
    const hexMatches=code.match(/\\x[0-9a-f]{2}/gi);
    if(hexMatches&&hexMatches.length>5)badges.push({type:'hex',label:'Hex escape ('+hexMatches.length+')'});
  }
  // Unicode escapes
  if(/\\u[0-9a-f]{4}/i.test(code)){
    const uniMatches=code.match(/\\u[0-9a-f]{4}/gi);
    if(uniMatches&&uniMatches.length>3)badges.push({type:'unicode',label:'Unicode \\u ('+uniMatches.length+')'});
  }
  // HTML entities
  if(/&#x?[0-9a-f]+;/i.test(code)){
    badges.push({type:'other',label:'HTML entities'});
  }
  // String concatenation obfuscation
  const concatMatches=code.match(/['"][^'"]{1,3}['"]\s*\+\s*['"][^'"]{1,3}['"]/g);
  if(concatMatches&&concatMatches.length>3){
    badges.push({type:'other',label:'Ghép chuỗi ('+concatMatches.length+')'});
  }
  // Nested function calls
  const nestedFn=code.match(/\w+\([\w,]+\(/g);
  if(nestedFn&&nestedFn.length>5){
    badges.push({type:'other',label:'Function lồng nhau'});
  }
  // Check for atob / btoa usage
  if(/atob\s*\(/.test(code))badges.push({type:'b64',label:'atob()'});
  
  if(badges.length===0){
    area.innerHTML+='<span class="det-badge other">Không phát hiện obfuscation</span>';
    document.getElementById('inputStat').textContent='sạch';
    document.getElementById('inputStat').className='badge';
    return;
  }
  
  document.getElementById('inputStat').textContent='phát hiện '+badges.length;
  document.getElementById('inputStat').className='badge warn';
  
  for(let b of badges){
    area.innerHTML+='<span class="det-badge '+b.type+'">'+b.label+'</span>';
  }
}

// ============================================================
// MẪU CODE OBFUSCATED
// ============================================================

function loadSample(){

eval(function(p,a,c,k,e,d){e=function(c){return c.toString(36)};if(!''.replace(/^/,String)){while(c--){d[c.toString(a)]=k[c]||c.toString(a)}k=[function(e){return d[e]}];e=function(){return'\\\\w+'};c=1};while(c--){if(k[c]){p=p.replace(new RegExp('\\\\b'+e(c)+'\\\\b','g'),k[c])}}return p}('6 0=4.1("9");0.2="8";0.3="7";4.5.6(0)',16,16,'script|createElement|src|async|document|body|appendChild|true|https://example.com/tracker.js|script'.split('|'),0,{}))`,

`// Mẫu 2: Hex + Unicode escapes

var _0x1a2b = atob("ZnVuY3Rpb24gZ3JlZXQobmFtZSkge2NvbnNvbGUubG9nKCJIZWxsbywgIiArIG5hbWUpO30=");

  ];
  
  const idx=Math.floor(Math.random()*samples.length);
  document.getElementById('inputCode').value=samples[idx];

// ============================================================
// ENGINE GIẢI MÃ CHÍNH
// ============================================================

function deobfuscate(){
  const btn=document.getElementById('deobfBtn');
  const input=document.getElementById('inputCode').value.trim();
  if(!input){showToast('Vui lòng nhập code cần giải mã','error');return}
  
  btn.disabled=true;btn.textContent='⏳ Đang xử lý...';
  document.getElementById('outputDot').className='dot yellow';
  document.getElementById('outputStatus').textContent='Đang giải mã...';
  document.getElementById('perfInfo').textContent='';
  document.getElementById('outputStat').textContent='đang chạy';
  document.getElementById('outputStat').className='badge warn';
  
  setTimeout(()=>{
    try{
      const start=performance.now();
      const result=deobfuscateWeb(input);
      const elapsed=((performance.now()-start)).toFixed(1);
      
      document.getElementById('outputCode').value=result.code;
      document.getElementById('outputChars').textContent=result.code.length+' ký tự';
      document.getElementById('outputLines').textContent=(result.code.split('\n').length)+' dòng';
      
      document.getElementById('outputDot').className='dot green';
      document.getElementById('outputStatus').textContent='Đã giải mã';
      document.getElementById('perfInfo').textContent='⏱ '+elapsed+'ms';
      document.getElementById('outputStat').textContent='hoàn tất';
      document.getElementById('outputStat').className='badge active';
      document.getElementById('copyBtn').disabled=false;
      
      showToast('✅ Đã giải mã xong — '+result.transformations+' bước xử lý','success');
    }catch(e){
      document.getElementById('outputCode').value='// LỖI: '+e.message+'\n// '+e.stack;
      document.getElementById('outputDot').className='dot red';
      document.getElementById('outputStatus').textContent='Lỗi: '+e.message;
      document.getElementById('outputStat').textContent='lỗi';
      document.getElementById('outputStat').className='badge warn';
      showToast('❌ Lỗi: '+e.message,'error');
    }finally{
      btn.disabled=false;btn.textContent='⚡ Giải mã';
    }
  },100);
}

function deobfuscateWeb(code){
  let result=code;
  const log=[];
  let transformations=0;
  
  // === Bước 1: Giải mã HTML entities ===
  const before1=result;
  result=result.replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(parseInt(n,10)));
  result=result.replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  if(result!==before1){
    transformations++;
    log.push('✅ Giải mã HTML entities');
  }
  
  // === Bước 2: Giải mã hex escapes ===
  const before2=result;
  result=result.replace(/\\x([0-9a-f]{2})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  if(result!==before2){
    transformations++;
    log.push('✅ Giải mã hex escapes (\\xXX)');
  }
  
  // === Bước 3: Giải mã unicode escapes trong string ===
  const before3=result;
  result=result.replace(/(?:"[^"]*"|'[^']*'|`[^`]*`)/g,(match)=>{
    return match.replace(/\\u([0-9a-f]{4})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  });
  // Giải mã unicode trong tên biến (tên biến unicode)
  result=result.replace(/\\u([0-9a-f]{4})/gi,(m,h)=>String.fromCharCode(parseInt(h,16)));
  if(result!==before3){
    transformations++;
    log.push('✅ Giải mã Unicode escapes (\\uXXXX)');
  }
  
  // === Bước 4: Giải mã packed JS (eval(function(p,a,c,k,e,d)...)) ===
  // Pattern: eval(function(p,a,c,k,e,d){...}(...))
  const packedRegex=/eval\s*\(\s*function\s*\(\s*p\s*,\s*a\s*,\s*c\s*,\s*k\s*,\s*e\s*,\s*d\s*\)[\s\S]*?}\s*\(\s*['"]([\s\S]*?)['"]\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(['"][\s\S]*?['"])\s*\.split\s*\(\s*['"]\|['"]\s*\)\s*(?:,\s*\{[^}]*\}\s*)?,\s*\{\}\s*\)\s*\)/;
  const packedMatch=result.match(packedRegex);
  if(packedMatch){
    try{
      const payload=packedMatch[1];
      const a=parseInt(packedMatch[2]);
      const c=parseInt(packedMatch[3]);
      const kStr=packedMatch[4];
      const k=kStr.slice(1,-1).split('|');
      
      // Giải mã packed
      let unpacked='';
      for(let i=0;i<payload.length;i++){
        const ch=payload[i];
        if(/[a-z]/i.test(ch)){
          const code=ch.charCodeAt(0);
          const base=ch>='a'?97:65;
          const idx=code-base;
          if(idx>=0&&idx<k.length&&k[idx]!=='')unpacked+=k[idx];
          else unpacked+=ch;
        }else{
          unpacked+=ch;
        }
      }
      
      if(unpacked&&unpacked!==payload){
        result=result.replace(packedMatch[0],unpacked);
        transformations++;
        log.push('✅ Giải mã packed JS (eval p,a,c,k,e,d)');
      }
    }catch(e){
      log.push('⚠️ Phát hiện packed JS nhưng không giải mã được hoàn toàn');
    }
  }
  
  // === Bước 5: Giải mã base64 (atob / base64 inline) ===
  const before5=result;
  // Xử lý atob() calls
  result=result.replace(/atob\s*\(\s*['"]([A-Za-z0-9+/=]{10,})['"]\s*\)/g,(m,b64)=>{
    try{
      const decoded=atob(b64);
      if(decoded.length>3)return '"'+decoded+'"';
      return m;
    }catch(e){return m}
  });
  // Xử lý base64 trong string gán cho biến
  result=result.replace(/['"]([A-Za-z0-9+/=]{30,})['"]/g,(m,b64)=>{
    // Chỉ decode nếu có vẻ là base64 thật
    if(/^[A-Za-z0-9+/]{20,}={0,2}$/.test(b64)){
      try{
        const decoded=atob(b64);
        // Kiểm tra xem decoded có phải text không
        if(decoded.length>5&&/[a-zA-Z0-9_$(){}\[\]]{10,}/.test(decoded)){
          return '"'+decoded.replace(/"/g,'\\"')+'"';
        }
      }catch(e){}
    }
    return m;
  });
  if(result!==before5){
    transformations++;
    log.push('✅ Giải mã Base64 (atob/inline)');
  }
  
  // === Bước 6: Giải mã ghép chuỗi (concat) ===
  const before6=result;
  // Pattern: "a"+"b"+"c" hoặc 'a'+'b'+'c'
  result=result.replace(/(['"])([^'"]*?)\1\s*\+\s*(['"])([^'"]*?)\3/g,(m,q1,s1,q2,s2)=>{
    return '"'+s1+s2+'"';
  });
  // Lặp lại để ghép chuỗi dài
  for(let i=0;i<10;i++){
    const newResult=result.replace(/(['"])([^'"]{2,}?)\1\s*\+\s*(['"])([^'"]*?)\3/g,(m,q1,s1,q2,s2)=>{
      return '"'+s1+s2+'"';
    });
    if(newResult===result)break;
    result=newResult;
    if(i===0)transformations++;
  }
  if(result!==before6){
    log.push('✅ Giải mã ghép chuỗi (concat)');
  }
  
  // === Bước 7: Làm đẹp code (beautify cơ bản) ===
  result=beautifyJS(result);
  transformations++;
  log.push('✅ Làm đẹp code (indentation)');
  
  // === Bước 8: Dọn dẹp ===
  result=result.replace(/^\/\/ .+?\n\/\/ /gm,'// ');
  result=result.replace(/[ \t]+$/gm,'').trim();
  if(!result.endsWith('\n'))result+='\n';
  
  return {code:result,transformations,log};
}

function beautifyJS(code){
  let indent=0;
  const indentStr='  ';
  const lines=code.split('\n');
  const result=[];
  let inTemplate=false;
  
  for(let i=0;i<lines.length;i++){
    let line=lines[i].trim();
    if(!line){result.push('');continue}
    
    // Giảm indent khi gặp đóng block
    if(/^\}/.test(line)||/^\];/.test(line)){
      indent=Math.max(0,indent-1);
    }
    
    result.push(indentStr.repeat(indent)+line);
    
    // Tăng indent khi mở block
    if(/\{\s*$/.test(line)||/\{$/.test(line)){
      indent++;
    }
    // if/for/while/function không có { trên cùng dòng
    if(/\b(if|else|for|while|function|do|try|catch|finally)\b/.test(line)&&
       !/\{/.test(line)&&!/;\s*$/.test(line)){
      indent++;
    }
    // case/default trong switch
    if(/^\s*(case\s.+:|default:)/.test(line)){
      // case ở indent thấp hơn nội dung
    }
  }
  
  return result.join('\n');
}

function copyOutput(){
  const text=document.getElementById('outputCode').value;
  if(!text||text.startsWith('// LỖI')){showToast('Không có gì để copy','error');return}
  navigator.clipboard.writeText(text).then(()=>showToast('✅ Đã copy vào clipboard!','success'))
    .catch(()=>{document.getElementById('outputCode').select();document.execCommand('copy');showToast('✅ Đã copy!','success');});
}
