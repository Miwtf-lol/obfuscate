<!DOCTYPE html>
<html lang="en">
<head>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a0e17;color:#e0e0e0;min-height:100vh;overflow:hidden}
.header{background:linear-gradient(135deg,#0d1b2a,#1b2838);border-bottom:1px solid #2a3a5c;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,#4fc3f7,#00e676);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header .sub{font-size:13px;color:#8899aa;margin-left:auto}
.header .actions{display:flex;gap:8px;align-items:center}
.btn{padding:6px 16px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,#4fc3f7,#00bcd4);color:#0a0e17}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(79,195,247,.3)}
.btn-secondary{background:#1e2d42;color:#b0c4de;border:1px solid #2a3a5c}
.btn-secondary:hover{background:#2a3d5a}
.btn-danger{background:#ef5350;color:#fff}
.btn-danger:hover{background:#e53935}
.btn-success{background:#00e676;color:#0a0e17}
.btn-success:hover{box-shadow:0 4px 20px rgba(0,230,118,.3)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
.container{display:grid;grid-template-columns:1fr 1fr;gap:0;height:calc(100vh - 64px)}
.panel{display:flex;flex-direction:column;min-height:0}
.panel-left{border-right:1px solid #1e2d42}
.panel-header{padding:8px 16px;border-bottom:1px solid #1e2d42;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:10px;background:#0d1117;flex-shrink:0}
.panel-header .badge{padding:2px 8px;border-radius:10px;font-size:10px;background:#1e2d42;color:#8899aa}
.panel-header .badge.active{background:#00e67622;color:#00e676;border:1px solid #00e67644}
.panel-header .badge.warn{background:#ff980022;color:#ff9800;border:1px solid #ff980044}
.panel-tabs{display:flex;gap:4px;margin-left:auto}
.panel-tab{padding:3px 10px;border-radius:4px;font-size:11px;cursor:pointer;color:#6b7b8d;background:transparent;border:1px solid transparent;transition:all .2s}
.panel-tab:hover{color:#b0c4de;background:#1a2538}
.panel-tab.active{color:#4fc3f7;background:#1a2538;border-color:#4fc3f744}
.editor-wrap{flex:1;position:relative;overflow:hidden}
.editor-wrap textarea{width:100%;height:100%;resize:none;border:none;outline:none;background:#0a0e17;color:#e0e0e0;font-family:'JetBrains Mono','Fira Code','Cascadia Code',monospace;font-size:13px;line-height:1.6;padding:16px;tab-size:4;overflow:auto}
.editor-wrap textarea::placeholder{color:#3a4a5a}
.editor-wrap .line-nums{position:absolute;left:0;top:0;padding:16px 8px 16px 12px;font-family:'JetBrains Mono','Fira Code',monospace;font-size:13px;line-height:1.6;color:#2a3a5c;text-align:right;user-select:none;overflow:hidden;pointer-events:none}
.status-bar{display:flex;align-items:center;gap:12px;padding:5px 16px;border-top:1px solid #1e2d42;font-size:11px;color:#5a6a7a;background:#0d1117;flex-shrink:0}
.status-bar .stat{display:flex;align-items:center;gap:4px}
.status-bar .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-bar .dot.green{background:#00e676}
.status-bar .dot.yellow{background:#ff9800}
.status-bar .dot.red{background:#ef5350}
.options-bar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 16px;border-bottom:1px solid #1e2d42;background:#0d1117;flex-shrink:0}
.opt-check{display:flex;align-items:center;gap:5px;font-size:12px;color:#8899aa;cursor:pointer;padding:2px 8px;border-radius:4px;transition:all .2s}
.opt-check:hover{background:#1a2538;color:#b0c4de}
.opt-check input{accent-color:#4fc3f7;width:14px;height:14px;cursor:pointer}
.opt-check.active{color:#b0c4de}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 24px;border-radius:8px;font-size:14px;font-weight:500;z-index:999;transform:translateY(100px);opacity:0;transition:all .4s cubic-bezier(.4,0,.2,1);pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{background:#00e676;color:#0a0e17;box-shadow:0 8px 32px rgba(0,230,118,.3)}
.toast.error{background:#ef5350;color:#fff;box-shadow:0 8px 32px rgba(239,83,80,.3)}
.toast.info{background:#4fc3f7;color:#0a0e17;box-shadow:0 8px 32px rgba(79,195,247,.3)}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0a0e17}
::-webkit-scrollbar-thumb{background:#1e2d42;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#2a3a5c}

/* Responsive */
@media(max-width:768px){
  .container{grid-template-columns:1fr;height:auto;min-height:calc(100vh - 64px)}
  .panel-left{border-right:none;border-bottom:1px solid #1e2d42}
  .panel{min-height:50vh}
  .header .sub{display:none}
  .options-bar{gap:4px}
  .opt-check{font-size:11px;padding:2px 6px}
}

/* Skeleton loading */
.skeleton{position:absolute;inset:0;background:linear-gradient(90deg,#0a0e17 25%,#111827 50%,#0a0e17 75%);background-size:200% 100%;animation:skeleton 1.5s infinite;display:none;z-index:5}
.skeleton.active{display:block}
@keyframes skeleton{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>

<body>

<div class="header">
  <h1>◈ Lua Deobfuscator</h1>
  <span style="font-size:12px;color:#5a6a7a">v2.0 · Web Tool</span>
  <div class="sub">
    <span id="versionBadge" style="padding:2px 10px;border-radius:10px;background:#1a2538;border:1px solid #2a3a5c;font-size:11px">Lua 5.1 · 5.2 · 5.3 · LuaJIT</span>

-- Or click 'Sample' to try an example

-- Example: local a=_G['\115\116\114\105\110\103'];local b=a['\98\121\116\101'];local c=b('\72\101\108\108\111')">-- Paste your obfuscated Lua code here...
-- Or click 'Sample' to try an example</textarea>
      <div id="astView" style="display:none;width:100%;height:100%;overflow:auto;padding:16px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#8899aa;background:#0a0e17;white-space:pre;line-height:1.5"></div>
    </div>
    <div class="status-bar">

      <div id="reportView" style="display:none;width:100%;height:100%;overflow:auto;padding:16px;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6;background:#0a0e17;color:#b0c4de"></div>
    </div>
    <div class="status-bar">
      <span class="stat"><span class="dot" id="outputDot"></span> <span id="outputStatus">Waiting for input</span></span>
      <span class="stat" id="outputChars">0 chars</span>
      <span class="stat" id="outputLines">0 lines</span>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// LUA DEOBFUSCATOR ENGINE
// ============================================================

// --- Utility ---
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function uuid(){return Math.random().toString(36).substr(2,9)}

// --- Toast ---
let toastTimer;
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;
  clearTimeout(toastTimer);
  requestAnimationFrame(()=>{t.classList.add('show')});
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

// --- Tab Switching ---
function switchInputTab(el,tab){
  document.querySelectorAll('.panel-left .panel-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const code=document.getElementById('inputCode');
  const ast=document.getElementById('astView');
  if(tab==='code'){code.style.display='';ast.style.display='none'}
  else{
    code.style.display='none';ast.style.display='';
    try{
      const astData=luaparse.parse(document.getElementById('inputCode').value,{luaVersion:'5.1',comments:false,locations:false});
      ast.textContent=JSON.stringify(astData,null,2);
    }catch(e){ast.textContent='// AST Parse Error:\n'+e.message}
  }
}
function switchOutputTab(el,tab){
  document.querySelectorAll('.panel-right .panel-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('outputCode').style.display=tab==='code'?'':'none';
  document.getElementById('diffView').style.display=tab==='diff'?'':'none';
  document.getElementById('reportView').style.display=tab==='report'?'':'none';
}

// --- File Upload ---
function handleFileUpload(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    document.getElementById('inputCode').value=ev.target.result;
    updateInputStats();
    showToast('Loaded: '+file.name,'info');
  };
  reader.readAsText(file);
  e.target.value='';
}

// --- Stats ---
function updateInputStats(){
  const v=document.getElementById('inputCode').value;
  document.getElementById('inputChars').textContent=v.length+' chars';
  document.getElementById('inputLines').textContent=(v.split('\n').length)+' lines';
}
document.getElementById('inputCode').addEventListener('input',updateInputStats);
updateInputStats();

// --- Sample ---
function loadSample(){
  const samples=[
`-- Sample 1: Hex-encoded strings + variable obfuscation
local _0x1 = _G['\\115\\116\\114\\105\\110\\103']
local _0x2 = _0x1['\\98\\121\\116\\101']
local _0x3 = _0x1['\\99\\104\\97\\114']

local _0x4 = {}
_0x4[1] = _0x3(72) .. _0x3(101) .. _0x3(108) .. _0x3(108) .. _0x3(111)
_0x4[2] = _0x3(87) .. _0x3(111) .. _0x3(114) .. _0x3(108) .. _0x3(100)

local function _0x5(_0x6)
  local _0x7 = ""
  for _0x8 = 1, #_0x6 do
    _0x7 = _0x7 .. _0x3(_0x6:byte(_0x8) + 1)
  end
  return _0x7
end

print(_0x4[1] .. ", " .. _0x4[2] .. "!")
print("Encoded: " .. _0x5("Hello"))`,

`-- Sample 2: Control flow + junk code
local a=1;local b=2;local c=3
local d={}
d[1]=function(x)return x+1 end
d[2]=function(x)return x*2 end
d[3]=function(x)return x-3 end
local e=true
if a<b then
  local _=a+b;local __=a*b
  if e then
    for i=1,5 do
      local junk="dead code"
      local morejunk=function()return 42 end
      print("step",i,d[1](i))
    end
  end
  local _x=a+c;local _y=b*c
else
  print("unreachable")
end
local f={}
for k=1,10 do
  local tmp=k*2
  f[k]=function(n)return n+tmp end
end
print(f[3](5))`,

`-- Sample 3: Table-based string lookups
local S = {
  ["\\x48\\x65\\x6c\\x6c\\x6f"] = true,
  ["\\x57\\x6f\\x72\\x6c\\x64"] = true,
  ["\\x54\\x65\\x73\\x74"] = true
}
local keys = {}
for k in pairs(S) do keys[#keys+1] = k end
local function decode(str)
  local out = ""
  for i = 1, #str do
    local c = str:sub(i,i)
    if c == "\\\\" then
      local hex = str:sub(i+2,i+3)
      out = out .. string.char(tonumber(hex, 16))
      i = i + 3
    else
      out = out .. c
    end
  end
  return out
end
for i=1,#keys do
  print(decode(keys[i]))
end`
  ];
  const current=document.getElementById('inputCode').value.trim();
  const idx=current&&current!==document.getElementById('inputCode').placeholder?Math.floor(Math.random()*samples.length):0;
  document.getElementById('inputCode').value=samples[idx];
  updateInputStats();
  showToast('Sample '+(idx+1)+' loaded','info');
}

// ============================================================
// CORE DEOBFUSCATION ENGINE
// ============================================================

function deobfuscate(){
  const btn=document.getElementById('deobfBtn');
  const input=document.getElementById('inputCode').value.trim();
  if(!input){showToast('Please enter Lua code first','error');return}
  
  btn.disabled=true;btn.textContent='⏳ Processing...';
  document.getElementById('inputSkeleton').classList.add('active');
  document.getElementById('outputSkeleton').classList.add('active');
  document.getElementById('outputDot').className='dot yellow';
  document.getElementById('outputStatus').textContent='Processing...';
  document.getElementById('perfInfo').textContent='';
  
  const opts={
    rename: document.getElementById('optRename').checked,
    decodeStr: document.getElementById('optDecodeStr').checked,
    cleanFlow: document.getElementById('optCleanFlow').checked,
    removeJunk: document.getElementById('optRemoveJunk').checked,
    resolveExpr: document.getElementById('optResolveExpr').checked,
  };
  
  setTimeout(()=>{
    try{
      const start=performance.now();
      const result=deobfuscateLua(input,opts);
      const elapsed=((performance.now()-start)).toFixed(1);
      
      document.getElementById('outputCode').value=result.code;
      document.getElementById('outputChars').textContent=result.code.length+' chars';
      document.getElementById('outputLines').textContent=(result.code.split('\n').length)+' lines';
      
      // Build diff view
      buildDiffView(input,result.code);
      
      // Build report
      buildReport(result.report,elapsed);
      
      document.getElementById('outputDot').className='dot green';
      document.getElementById('outputStatus').textContent='Deobfuscated';
      document.getElementById('perfInfo').textContent='⏱ '+elapsed+'ms';
      document.getElementById('outputStat').textContent='done';
      document.getElementById('outputStat').className='badge active';
      document.getElementById('copyBtn').disabled=false;
      
      showToast(`Deobfuscated in ${elapsed}ms — ${result.report.transformations} transformations applied`,'success');
    }catch(e){
      document.getElementById('outputCode').value='-- ERROR: '+e.message;
      document.getElementById('outputDot').className='dot red';
      document.getElementById('outputStatus').textContent='Error: '+e.message;
      document.getElementById('outputStat').textContent='error';
      document.getElementById('outputStat').className='badge warn';
      showToast('Error: '+e.message,'error');
    }finally{
      btn.disabled=false;btn.textContent='⚡ Deobfuscate';
      document.getElementById('inputSkeleton').classList.remove('active');
      document.getElementById('outputSkeleton').classList.remove('active');
    }
  },100);
}

function deobfuscateLua(code,opts){
  let result=code;
  const report={transformations:0,details:[]};
  
  // Step 1: Decode hex escapes (\x48\x65 etc.)
  if(opts.decodeStr){
    const before=result;
    result=result.replace(/\\x([0-9a-fA-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));
    if(result!==before){
      const count=(result.match(/[^\x00-\x7F]/g)||[]).length;
      report.transformations++;
      report.details.push('Decoded \\xXX hex escapes');
    }
  }
  
  // Step 2: Decode decimal escapes (\115\116\114 etc.)
  if(opts.decodeStr){
    const before=result;
    // Match \xxx (1-3 digit decimal) but not inside already processed
    result=result.replace(/\\(\d{1,3})/g,(m,num)=>{
      const n=parseInt(num,10);
      if(n>=32&&n<=126)return String.fromCharCode(n);
      return m;
    });
    if(result!==before){
      report.transformations++;
      report.details.push('Decoded \\ddd decimal escapes');
    }
  }
  
  // Step 3: Resolve string.byte/char patterns
  if(opts.resolveExpr){
    const before=result;
    // string.char(n1,n2,...) or ('string'):byte(i)
    result=result.replace(/string\.char\s*\(([^)]+)\)/g,(m,args)=>{
      try{
        const nums=args.split(',').map(s=>{
          const t=s.trim();
          if(!isNaN(t))return parseInt(t,10);
          return null;
        });
        if(nums.some(n=>n===null))return m;
        const str=nums.map(n=>String.fromCharCode(n)).join('');
        return '"'+str+'"';
      }catch(e){return m}
    });
    // ('string'):byte(i) or str:byte(i)
    result=result.replace(/:\s*byte\s*\(\s*(\d+)\s*\)/g,(m,i)=>{
      // Simplified: can't fully resolve without context
      return m;
    });
    if(result!==before){
      report.transformations++;
      report.details.push('Resolved string.char() calls');
    }
  }
  
  // Step 4: Rename obfuscated variables (_0x1, _0x2, L0_1, etc.)
  if(opts.rename){
    const before=result;
    const varPattern=/\b(_0x[a-f0-9]+|L\d+_\d+|v\d+_\d+|_0[a-f0-9]{2,})\b/g;
    const seen=new Map();
    let counter=0;
    result=result.replace(varPattern,(m)=>{
      if(!seen.has(m)){
        counter++;
        seen.set(m,'var_'+counter);
      }
      return seen.get(m);
    });
    if(result!==before){
      report.transformations++;
      report.details.push(`Renamed ${seen.size} obfuscated variables`);
    }
  }
  
  // Step 5: Clean control flow — remove dead/unreachable code after return/break
  if(opts.cleanFlow){
    const before=result;
    // Remove unreachable code after return in blocks
    result=result.replace(/(\breturn\b[^;\n]*)\n\s*((?:local\s+)?\w+\s*=[^;\n]*\n?)*/g,'$1\n');
    // Remove empty if true/if false branches
    result=result.replace(/if\s+true\s+then\s*\n([\s\S]*?)\n\s*end/g,'$1');
    result=result.replace(/if\s+false\s+then\s*\n[\s\S]*?\n\s*end/g,'');
    if(result!==before){
      report.transformations++;
      report.details.push('Cleaned control flow / dead branches');
    }
  }
  
  // Step 6: Remove junk code blocks
  if(opts.removeJunk){
    const before=result;
    // Remove patterns like: local _ = ... (unused underscore vars)
    result=result.replace(/^\s*local\s+_\s*=\s*[^;\n]+;?\s*$/gm,'');
    // Remove assignments that look unused (heuristic)
    result=result.replace(/^\s*local\s+__+\s*=\s*[^;\n]+;?\s*$/gm,'');
    // Remove empty lines from previous removals
    result=result.replace(/\n{3,}/g,'\n\n');
    if(result!==before){
      report.transformations++;
      report.details.push('Removed junk/dead code');
    }
  }
  
  // Step 7: Beautify / normalize indentation
  result=beautifyLua(result);
  report.transformations++;
  report.details.push('Beautified and normalized indentation');
  
  // Step 8: Final cleanup
  result=result.replace(/[ \t]+$/gm,'').trim();
  if(!result.endsWith('\n'))result+='\n';
  
  return {code:result,report};
}

function beautifyLua(code){
  let indent=0;
  const indentStr='  ';
  let lines=code.split('\n');
  let result=[];
  
  for(let i=0;i<lines.length;i++){
    let line=lines[i].trim();
    if(!line){result.push('');continue}
    
    // Decrease indent for ending keywords
    if(/^\b(end|until|else|elseif)\b/.test(line)||/^\bend\b/.test(line)){
      indent=Math.max(0,indent-1);
    }
    // Decrease indent for closing braces
    if(/^\}\)?/.test(line)||/^\}\)?\s*$/.test(line)){
      indent=Math.max(0,indent-1);
    }
    
    result.push(indentStr.repeat(indent)+line);
    
    // Increase indent for starting keywords
    if(/\b(then|do|function\s*\(|function\s+\w+\s*\(|repeat|else)\s*$/.test(line)||
       /\bif\b/.test(line)&&/\bthen\s*$/.test(line)||
       /\bfor\b/.test(line)&&/\bdo\s*$/.test(line)||
       /\bwhile\b/.test(line)&&/\bdo\s*$/.test(line)){
      indent++;
    }
    // Increase indent for { at end
    if(/\{\s*$/.test(line)){
      indent++;
    }
    // Adjust for function definitions
    if(/^local\s+function\s+\w+|^function\s+\w+/.test(line)&&/\s*\([^)]*\)\s*$/.test(line)){
      indent++;
    }
  }
  
  return result.join('\n');
}

function buildDiffView(original,deobfuscated){
  const origLines=original.split('\n');
  const deobLines=deobfuscated.split('\n');
  const maxLines=Math.max(origLines.length,deobLines.length);
  let html='<div style="font-family:\'JetBrains Mono\',monospace;font-size:12px;line-height:1.6">';
  html+='<div style="padding:4px 0 8px;font-size:11px;color:#5a6a7a;border-bottom:1px solid #1e2d42;margin-bottom:8px">';
  html+=`<span style="color:#ef5350">■ -${origLines.length} lines</span> &nbsp; <span style="color:#00e676">■ +${deobLines.length} lines</span>`;
  html+='</div>';
  
  for(let i=0;i<maxLines;i++){
    const o=origLines[i]||'';
    const d=deobLines[i]||'';
    if(o===d){
      html+=`<div style="color:#3a4a5a;padding:0 8px"><span style="color:#2a3a5c;width:40px;display:inline-block;text-align:right;margin-right:12px;font-size:10px">${i+1}</span>${escapeHtml(o)}</div>`;
    }else{
      if(o)html+=`<div style="background:#ef535011;color:#ef5350;padding:0 8px;border-left:2px solid #ef5350"><span style="color:#ef535066;width:40px;display:inline-block;text-align:right;margin-right:12px;font-size:10px">${i+1}</span>− ${escapeHtml(o)}</div>`;
      if(d)html+=`<div style="background:#00e67611;color:#00e676;padding:0 8px;border-left:2px solid #00e676"><span style="color:#00e67666;width:40px;display:inline-block;text-align:right;margin-right:12px;font-size:10px">${i+1}</span>+ ${escapeHtml(d)}</div>`;
    }
  }
  html+='</div>';
  document.getElementById('diffView').innerHTML=html;
}

function buildReport(report,elapsed){
  let html='<div style="padding:4px 0">';
  html+=`<h3 style="color:#4fc3f7;font-size:15px;margin-bottom:12px">📊 Deobfuscation Report</h3>`;
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">`;
  html+=`<div style="background:#0d1117;border:1px solid #1e2d42;border-radius:8px;padding:12px"><div style="font-size:24px;font-weight:700;color:#00e676">${report.transformations}</div><div style="font-size:11px;color:#6b7b8d">Transformations</div></div>`;
  html+=`<div style="background:#0d1117;border:1px solid #1e2d42;border-radius:8px;padding:12px"><div style="font-size:24px;font-weight:700;color:#4fc3f7">${elapsed}ms</div><div style="font-size:11px;color:#6b7b8d">Processing Time</div></div>`;
  html+='</div>';
  
  if(report.details.length){
    html+='<div style="font-size:13px;font-weight:600;color:#b0c4de;margin-bottom:8px">Applied Techniques</div>';
    html+='<div style="display:flex;flex-direction:column;gap:4px">';
    report.details.forEach((d,i)=>{
      html+=`<div style="background:#0d1117;border:1px solid #1e2d42;border-radius:6px;padding:8px 12px;font-size:12px;color:#8899aa"><span style="color:#4fc3f7;margin-right:8px">▸</span>${d}</div>`;
    });
    html+='</div>';
  }
  
  html+='<div style="margin-top:16px;padding:10px;background:#0d1117;border:1px solid #1e2d42;border-radius:8px;font-size:11px;color:#5a6a7a">';
  html+='💡 <b>Tips:</b> Toggle options in the toolbar for different deobfuscation passes. Try multiple passes with different settings for complex obfuscation.';
  html+='</div>';
  
  html+='</div>';
  document.getElementById('reportView').innerHTML=html;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyOutput(){
  const text=document.getElementById('outputCode').value;
  if(!text){showToast('Nothing to copy','error');return}
  navigator.clipboard.writeText(text).then(()=>{
    showToast('Copied to clipboard!','success');
  }).catch(()=>{
    // Fallback
    document.getElementById('outputCode').select();
    document.execCommand('copy');
    showToast('Copied to clipboard!','success');
  });
}

document.addEventListener('keydown',(e)=>{

    e.preventDefault();
